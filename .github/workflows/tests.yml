name: Power engine tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade --upgrade-strategy eager -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - name: Require real numerical dependencies
        run: python -c "import pandapower, scipy, numpy, pydantic; print('pandapower', pandapower.__version__, 'scipy', scipy.__version__, 'numpy', numpy.__version__, 'pydantic', pydantic.__version__)"
      - run: ruff check .
      - run: python -m pytest --require-ac --strict-markers --cov-fail-under=89 --cov=power_engine --cov=simulator --cov-report=term-missing --cov-report=xml --junitxml=outputs/junit.xml
      - name: Closed loop A
        run: python -m simulator demo --scenario A --output outputs/demo-A
      - name: Closed loop B
        run: python -m simulator demo --scenario B --output outputs/demo-B
      - name: Closed loop C
        run: python -m simulator demo --scenario C --output outputs/demo-C
      - name: Export all wire schemas
        run: python -m simulator schemas --output outputs/schemas
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Paired-seed experiment on both SciPy tracks
        if: matrix.os == 'ubuntu-latest' && matrix.python != '3.12'
        run: python -m simulator batch --cases 40 --steps 4 --output outputs/batch
      - name: Record resolved environment
        if: always()
        run: python -m pip freeze > requirements-resolved.txt
      - name: Record outdated packages for compatibility review
        run: python -m pip list --outdated --format=json > outputs/outdated.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: power-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            outputs/
            coverage.xml
            requirements-resolved.txt
            dist/
