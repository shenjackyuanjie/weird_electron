[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gridguardian-power"
version = "0.1.0"
description = "GridGuardian phase-2 deterministic microgrid simulator and safety gate"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pandapower==3.4.0", "scipy==1.16.3", "pydantic==2.12.5", "numpy==2.3.5"]

[project.scripts]
gridguardian = "simulator.cli:main"

[tool.setuptools.packages.find]
include = ["power_engine*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires real pandapower (never replaced with a fake solver)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
