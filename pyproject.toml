[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridguardian-power"
version = "0.1.0"
description = "GridGuardian phase-2 deterministic microgrid simulator and safety gate"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandapower==3.5.6",
    "numpy==2.4.6",
    "pydantic==2.14.1",
    "scipy==1.17.1; python_version < '3.12'",
    "scipy==1.18.1; python_version >= '3.12'",
]

[project.scripts]
gridguardian = "simulator.cli:main"

[tool.setuptools.packages.find]
include = ["power_engine*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires real pandapower (never replaced with a fake solver)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
